spring.application.name=erp-latihan

# Database H2 in-memory: data awal dimuat ulang setiap aplikasi dijalankan
spring.datasource.url=jdbc:h2:mem:erp;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Konsol H2 untuk melihat isi tabel: http://localhost:8080/h2-console (JDBC URL di atas, user sa)
spring.h2.console.enabled=true

spring.jackson.time-zone=Asia/Jakarta
